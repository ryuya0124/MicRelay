name: MicRelay
options:
  developmentLanguage: ja
  knownRegions: [ja, en]
  bundleIdPrefix: net.ryuya-dev
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: FZ35ZF3CZV
    CODE_SIGN_STYLE: Automatic
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    GCC_OPTIMIZATION_LEVEL: '3'
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  MicRelay:
    type: application
    platform: iOS
    sources:
      - path: MicRelay
        excludes: [Resources/AppIcon.icon]
      - path: MicRelay/Resources/AppIcon.icon
        type: file
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.ryuya-dev.MicRelay
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_OBJC_BRIDGING_HEADER: MicRelay/Audio/MicRelay-Bridging-Header.h
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        MARKETING_VERSION: '1.1.0'
        CURRENT_PROJECT_VERSION: '15'
    info:
      path: MicRelay/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: MicRelay
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: Copyright © 2026 ryuya
        NSMicrophoneUsageDescription: この端末のマイク音声を、イヤホン・HDMI機器などへリアルタイムに出力するために使用します。画面録画で音声を含める場合は動画にも保存します。開発者への送信はありません。
        NSScreenCaptureUsageDescription: 選択した画面と音声を動画として端末内に保存するために使用します。録画からモニター音を除外するか選択できます。
        NSPhotoLibraryAddUsageDescription: 画面録画した動画を写真ライブラリへ保存するために使用します。写真の閲覧は行いません。
        UIBackgroundModes: [audio, screen-capture]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  MicRelayTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MicRelayTests]
    dependencies: [{target: MicRelay}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MicRelayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MicRelayUITests]
    dependencies: [{target: MicRelay}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MicRelay:
    build:
      targets:
        MicRelay: all
    test:
      targets: [MicRelayTests, MicRelayUITests]
